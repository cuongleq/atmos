name: Daily Calibration

on:
  schedule:
    - cron: '30 6 * * *'  # 06:30 UTC daily (after GFS 00Z run completes on Open-Meteo)
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write  # Needed to commit benchmark.json

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git push

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect data from Open-Meteo (ERA5 + Previous-Runs)
        run: |
          echo "Downloading calibration data (this may take 10-30 minutes due to rate limits)..."
          node collect.mjs --interval 15000 --max-rate-waits 60

      - name: Run EMOS calibration
        run: |
          echo "Running EMOS calibration..."
          node bench.mjs

      - name: Verify benchmark.json
        run: |
          cat dist/benchmark.json | jq '.headline'

      - name: Commit benchmark.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/benchmark.json
          git diff --staged --quiet || git commit -m "📊 Daily calibration update $(date +%F)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: dist/benchmark.json
          retention-days: 30